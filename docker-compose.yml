services:
  postgres:
    image: postgres:17-alpine
    container_name: gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_dev_password
      POSTGRES_DB: gym
      # Deterministic collation so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # 5455 chosen to avoid clashing with other local Postgres instances
      # (5432 and 5433 are already used by other projects on this machine).
      - "5455:5432"
    volumes:
      - gym_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gym_pgdata:
