# Serves the app AND proxies the API, so both share one origin.
#
# That single fact is what makes the demo shareable. A bundle built with an
# absolute `http://localhost:8211` is useless the moment anyone else opens it —
# their browser dials THEIR machine. Same-origin means the page can call `/api`
# relatively, one tunnel exposes the whole thing, and CORS never enters into it.

upstream api {
    server api:8211;
}

server {
    listen 8210;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------ the backend
    # Long-form proxy headers rather than a bare proxy_pass: the API builds no
    # absolute URLs today, but a reverse proxy that lies about the request is a
    # debugging trap waiting for whoever adds the first redirect.
    location /api/ {
        proxy_pass         http://api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Handy for a curious viewer, and for anyone debugging the demo.
    location /api-docs/ { proxy_pass http://api/api-docs/; }
    location /swagger-ui { proxy_pass http://api/swagger-ui; }
    location = /health   { proxy_pass http://api/health; }
    location = /ready    { proxy_pass http://api/ready; }

    # --------------------------------------------------------------- the app
    # Hashed asset filenames change whenever their contents do, so they can be
    # cached hard. index.html must not be, or a viewer keeps an old bundle.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page bundle (app.json sets web.output = "single"), so every route
    # falls back to index.html — otherwise refreshing on /billing asks nginx for
    # a file that was never written and gets a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
